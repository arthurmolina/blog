# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: arthurmolina.com
subtitle: "❯ $DO || !$DO : try<br> try: Commando not found."
email: me@arthurmolina.com
description: >- # this means to ignore newlines until "baseurl:"
  I'm a software developer and I love to looking for solutions to problems.
twitter_username: molinaarthur
github_username: arthurmolina
minimal_mistakes_skin: dark
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-polyglot

# Polyglot (i18n)
languages: ["en", "pt"]
default_lang: "en"
exclude_from_localization: ["javascript", "images", "css", "assets"]
parallel_localization: false
lang_from_path: true

author:
  name   : "Arthur Molina"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "passionate about looking for solutions to problems"
  bio_pt : "apaixonado por encontrar soluções para os problemas"
  location: "Brazil"
  location_pt: "Brasil"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://arthurmolina.com"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/molinaarthur"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/arthurmolina"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/buildwithruby"

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/molinaarthur"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/arthurmolina"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/buildinruby"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-KLDLSH8QT9"
    anonymize_ip: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
